[project]
name = "llm-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daft[openai,ray]>=0.7.16",
    "fasttext>=0.9.3",
    "fastertext>=0.1.1",
    "ftfy>=6.3.1",
    "gigatoken>=0.10.0",
    "google-re2>=1.1.20251105",
    "kernels<0.15",
    "lxml>=6.1.1",
    "magic-html>=0.1.8",
    "orjson>=3.10,<4",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "py7zr>=1.1.3",
    "resiliparse>=1.0.8",
    "sentence-transformers>=5.6.0",
    "text-dedup>=0.4.1",
    "trafilatura>=2.1.0",
    "usearch>=2.26.0",
    "vllm>=0.26.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.15.22",
]
